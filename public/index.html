<script>
const U={kg:['g',1000],l:['ml',1000],pc:['pc',1],g:['g',1],pack:['pack',1]},OUT=['Areekode','Kondotty'];
let S;try{S=JSON.parse(localStorage.getItem('nest2'))}catch(e){}

const R=n=>'₹'+Math.round(n).toLocaleString('en-IN'),R2=n=>'₹'+(+n).toFixed(2),N=(n,d=2)=>(+n).toFixed(d);

const addD=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return iso(d)};
const rmOf=id=>S.rm.find(r=>r.id==id),fac=id=>U[rmOf(id).unit][1];
function price(id,d){const r=rmOf(id);if(r.prep){const rc=recipe(r,d);if(!rc||!rc.yield)return null;let t=0;for(const i of rc.items){const p=price(i.rm,d);if(p==null)return null;t+=i.q/fac(i.rm)*p}return t/(rc.yield/fac(id))}const p=r.prices.filter(x=>x.d<=d).sort((a,b)=>a.d<b.d?-1:1);return p.length?p[p.length-1].p:null}
function prevPrice(id,d){const p=rmOf(id).prices.filter(x=>x.d<=d).sort((a,b)=>a.d<b.d?-1:1);return p.length>1?p[p.length-2]:null}

function rcost(m,d){const rc=recipe(m,d);if(!rc)return null;let t=0;for(const i of rc.items){const p=price(i.rm,d);if(p==null)return null;t+=i.q/fac(i.rm)*p}return t}

function calc(d,outs){const r={},warn=[];S.rm.forEach(x=>r[x.id]={x,exp:0,open:0,pur:0,inn:0,out:0,close:0,waste:0,has:0,miss:0});let sales=0,items=0;
 S.sales.filter(s=>s.d==d&&outs.includes(s.o)).forEach(s=>{sales+=s.amt;items+=s.qty;const m=S.menu.find(m=>m.id==s.mid),rc=m&&recipe(m,d);if(!rc){warn.push('No recipe for '+(m?m.name:s.mid));return}rc.items.forEach(i=>{const pr=rmOf(i.rm);if(pr.prep){const pc=recipe(pr,d);if(!pc||!pc.yield){warn.push('No recipe for sauce '+pr.name);return}pc.items.forEach(j=>r[j.rm].exp+=s.qty*i.q/pc.yield*j.q/fac(j.rm))}else r[i.rm].exp+=s.qty*i.q/fac(i.rm)})});
 S.inv.filter(e=>e.d==d&&outs.includes(e.o)).forEach(e=>{const t=r[e.rm];if(!t)return;t.has=1;if(e.close==null)t.miss=1;['open','pur','inn','out','close'].forEach(k=>t[k]+=e[k]||0)});
 S.waste.filter(w=>w.d==d&&outs.includes(w.o)).forEach(w=>{if(r[w.rm])r[w.rm].waste+=w.qty});
 let ec=0,ac=0,pur=0,wc=0,lk=0;const rows=Object.values(r).filter(t=>t.has||t.exp>0);
 rows.forEach(t=>{const p=price(t.x.id,d);t.p=p;if(p==null)warn.push('Missing price: '+t.x.name);if(t.miss)warn.push('Missing closing stock: '+t.x.name);t.act=t.has&&!t.miss?t.open+t.pur+t.inn-t.close-t.out:null;
  if(t.act!=null&&t.act<0)warn.push('Negative consumption (check counts): '+t.x.name);if(!t.has&&t.exp>0)warn.push('No stock entry: '+t.x.name);
  t.var=t.act==null?null:t.act-t.exp;t.pct=t.var==null||!t.exp?null:t.var/t.exp*100;t.imp=t.var==null||p==null?0:t.var*p;if(p!=null){ec+=t.exp*p;ac+=(t.act||0)*p;pur+=t.pur*p;wc+=t.waste*p;if(t.imp>0)lk+=t.imp}});
 return{rows,sales,items,ec,ac,pur,wc,lk,warn:[...new Set(warn)]}}
function demo(){const rm=[['Fries','kg',90,12],['Chicken','kg',260,6],['Cheese','kg',480,3],['Sauce','l',120,4],['Oil','l',140,5],['Buns','pc',6,60],['Wraps','pc',5,60],['Packaging','pc',3,200]].map((a,i)=>({id:'r'+i,name:a[0],unit:a[1],min:a[3],demo:1,prices:[{d:'2026-08-01',p:a[2]}]}));
 rm[1].prices.push({d:'2026-09-15',p:275},{d:'2026-09-28',p:285});rm[4].prices.push({d:'2026-09-25',p:155});
 const mk=(id,name,pr,it)=>({id,name,price:pr,demo:1,rec:[{from:'2026-08-01',items:it.map(x=>({rm:'r'+x[0],q:x[1]}))}]});
 const menu=[mk('m0','Loaded Fries',110,[[0,180],[1,60],[2,30],[3,25],[4,15],[7,1]]),mk('m1','Zinger Burger',120,[[1,90],[5,1],[3,20],[4,20],[7,1]]),mk('m2','Zinger Roll',100,[[1,80],[6,1],[3,20],[4,15],[7,1]]),mk('m3','Cheese Fries',90,[[0,200],[2,40],[3,20],[7,1]]),mk('m4','Chicken Bites',99,[[1,100],[4,20],[3,20],[7,1]])];
 S={set:{target:42,t:[3,5,10]},rm,menu,inv:[],sales:[],waste:[],alias:{}};const base=[190,80,60,70,50],o='Areekode';
 for(let i=0;i<7;i++){const d=addD('2026-09-25',i);menu.forEach((m,j)=>{const q=i==6?[208,85,62,70,48][j]:Math.round(base[j]*(.9+.2*(((i+1)*(j+3))%5)/4));S.sales.push({d,o,mid:m.id,qty:q,amt:q*m.price,demo:1})})}
 const st={};for(let i=0;i<7;i++){const d=addD('2026-09-25',i),c=calc(d,[o]);c.rows.forEach((t,k)=>{const id=t.x.id,v=id=='r0'?(i==6?1.0737:1.06):id=='r1'?(i%2?1.05:1.02):1+((i*3+k)%4)/200;const act=+(t.exp*v).toFixed(2),op=st[id]!=null?st[id]:Math.ceil(t.exp*1.5),pu=Math.ceil(act*.9),cl=+(op+pu-act).toFixed(2);st[id]=cl;S.inv.push({d,o,rm:id,open:op,pur:pu,inn:0,out:0,close:cl,demo:1})})}
 S.waste.push({d:'2026-10-01',o,rm:'r0',qty:1.2,why:'Spoilage',who:'Kitchen',demo:1},{d:'2026-10-01',o,rm:'r1',qty:.4,why:'Cooking error',who:'Kitchen',demo:1},{d:'2026-09-30',o,rm:'r2',qty:.3,why:'Expired',who:'',demo:1});return S}
if(!S||!['sales','rm','menu','inv','waste'].every(k=>Array.isArray(S[k])))S=demo();S.closed=S.closed||{};
let V={tab:'dash',date:(S.sales.map(s=>s.d).sort().pop()||iso(new Date())),out:'Areekode'},P=null,ED=null;
const outs=()=>V.out=='All'?OUT:[V.out],g=id=>document.getElementById(id),val=id=>g(id)?g(id).value:'';
const bar=()=>`<div class="row"><input type="date" value="${V.date}" onchange="V.date=this.value;P=null;draw()"><select onchange="V.out=this.value;draw()">${['All',...OUT].map(o=>`<option ${o==V.out?'selected':''}>${o}</option>`).join('')}</select></div>`;
const demoNote=()=>S.rm.some(r=>r.demo)||S.menu.some(r=>r.demo)?`<p class="mut">Showing DEMO data (Areekode, 25 Sep–1 Oct 2026). Clear it in Settings when you start real entries.</p>`:'';
function dash(){const c=calc(V.date,outs()),tg=S.set.target;if(!c.sales&&!c.rows.length)return bar()+`<div class="card">No sales or stock for this date. Add them in Sales and Stock.</div>`;
 const tp=c.sales?c.ec/c.sales*100:0,ap=c.sales?c.ac/c.sales*100:0,vr=c.ac-c.ec,vp=c.ec?vr/c.ec*100:0,s=status(vp);
 const iss=c.rows.filter(t=>t.imp>0).sort((a,b)=>b.imp-a.imp).slice(0,5),L=[];
 L.push(`Food cost is <b>${N(ap,1)}%</b> of sales against a target of ${tg}%. Recipes alone predict ${N(tp,1)}%.`);
 iss.slice(0,3).forEach(t=>L.push(`${t.x.name} use is ${N(t.pct,1)}% above recipe expectation (${N(t.exp)} → ${N(t.act)} ${t.x.unit}), about ${R(t.imp)}.`));
 const pc=priceChanges(V.date);pc.slice(0,2).forEach(p=>L.push(`${p.n} price ${p.ch>0?'rose':'fell'} ${N(Math.abs(p.pc),1)}% (₹${p.a}→₹${p.b}/${p.u}). ${p.eff.map(e=>`Adds about ${R2(e.d)} to ${e.m}`).slice(0,2).join('; ')}.`));
 const mi=S.menu.map(m=>({m,c:rcost(m,V.date)})).filter(x=>x.c!=null).sort((a,b)=>b.c/b.m.price-a.c/a.m.price)[0];if(mi)L.push(`Highest recipe food cost: ${mi.m.name} at ${N(mi.c/mi.m.price*100,1)}% (cost ${R2(mi.c)} on price ₹${mi.m.price}).`);
 return bar()+demoNote()+(c.warn.length?`<div class="card warn"><h3>Data checks</h3>${c.warn.map(w=>`<div>• ${w}</div>`).join('')}</div>`:'')+
 `<div class="card"><div class="grid"><div class="k"><b>${R(c.sales)}</b><span>Sales · ${c.items} items</span></div><div class="k"><b>${R(c.ec)}</b><span>Expected food cost (${N(tp,1)}%)</span></div><div class="k"><b>${R(c.ac)}</b><span>Actual food cost (${N(ap,1)}%)</span></div><div class="k"><b class="${s[1]}">${vr>0?'+':''}${R(vr)}</b><span>Variance ${N(vp,1)}% ${s[2]} ${s[0]}</span></div><div class="k"><b>${R(c.pur)}</b><span>Purchases</span></div><div class="k"><b>${R(c.wc)}</b><span>Wastage</span></div></div><span class="mut">Target food cost ${tg}%. Actual = opening + purchases + stock in − closing − stock out, valued at the day's prices.</span></div>`+
 `<div class="card"><h3>What to look at</h3>${L.map(x=>`<p style="margin:0 0 6px">${x}</p>`).join('')}<p class="mut">Possible causes to investigate: portion size, wastage recording, stock counting, recipe accuracy, unrecorded stock movement or staff meals, supplier price changes.</p></div>`+
 `<div class="card"><h3>Top cost issues</h3>${iss.length?`<div class="sc"><table><tr><th>Item</th><th>Expected</th><th>Actual</th><th>Var %</th><th>Cost</th></tr>${iss.map(t=>{const z=status(t.pct);return`<tr><td>${z[2]} ${t.x.name}</td><td>${N(t.exp)}</td><td>${N(t.act)}</td><td class="${z[1]}">${t.pct>0?'+':''}${N(t.pct,1)}%</td><td>${R(t.imp)}</td></tr>`}).join('')}</table></div>`:'<span class="mut">No over-consumption found.</span>'}

 `<div class="card"><h3>All ingredients</h3><div class="sc"><table><tr><th>Item</th><th>Expected</th><th>Actual</th><th>Waste</th><th>Var %</th></tr>${c.rows.map(t=>{const z=t.pct==null?['','','–']:status(t.pct);return`<tr><td>${z[2]} ${t.x.name}</td><td>${N(t.exp)}</td><td>${t.act==null?'–':N(t.act)}</td><td>${N(t.waste)}</td><td class="${z[1]}">${t.pct==null?'–':N(t.pct,1)+'%'}</td></tr>`}).join('')}</table></div><span class="mut">Quantities in each material's unit (kg, l, pc).</span></div>`+
 `<div class="card"><h3>Menu cost now vs 30 days earlier</h3><div class="sc"><table><tr><th>Item</th><th>Price</th><th>Cost</th><th>30d ago</th><th>Food %</th><th>Margin</th></tr>${S.menu.map(m=>{const a=rcost(m,V.date),b=rcost(m,addD(V.date,-30));if(a==null)return`<tr><td>${m.name}</td><td colspan=5>Missing recipe or price</td></tr>`;const f=a/m.price*100,z=f>tg+5?'a':f>tg?'w':'n';return`<tr><td>${m.name}</td><td>₹${m.price}</td><td>${R2(a)}</td><td>${b==null?'–':R2(b)}</td><td class="${z}">${N(f,1)}%</td><td>${R2(m.price-a)}</td></tr>`}).join('')}</table></div><span class="mut">Recipe costs use ingredient prices valid on the chosen date, so past dates never change when prices move.</span></div>`}
function priceChanges(d){const o=[];S.rm.forEach(r=>{const pp=prevPrice(r.id,d),cp=price(r.id,d);if(!pp||cp==null)return;const cur=r.prices.filter(x=>x.d<=d).sort((a,b)=>a.d<b.d?-1:1).pop();if(cur.d<addD(d,-30))return;const eff=[];S.menu.forEach(m=>{const rc=recipe(m,d);const it=rc&&rc.items.find(i=>i.rm==r.id);if(it)eff.push({m:m.name,d:it.q/fac(r.id)*(cp-pp.p)})});o.push({n:r.name,a:pp.p,b:cp,u:r.unit,ch:cp-pp.p,pc:(cp-pp.p)/pp.p*100,eff:eff.sort((x,y)=>Math.abs(y.d)-Math.abs(x.d))})});return o.sort((a,b)=>Math.abs(b.pc)-Math.abs(a.pc))}
function sales(){const day=S.sales.filter(s=>s.d==V.date&&outs().includes(s.o));
 return bar()+`<div class="card"><h3>Upload POS sales (Excel or CSV)</h3><p class="mut">Columns: Date, Menu Item, Quantity Sold, Selling Price, Total Sales. Date is optional; the date above is used if missing. Sales go to ${V.out=='All'?OUT[0]:V.out}.</p><input type="file" accept=".xlsx,.xls,.csv" onchange="readFile(this.files[0])">${P?prev():''}</div>`+
 `<div class="card"><h3>Imported sales on ${V.date}</h3>${day.length?`<table>${day.map(s=>`<tr><td>${S.menu.find(m=>m.id==s.mid).name}</td><td>${s.o}</td><td>${s.qty}</td><td>${R(s.amt)}</td></tr>`).join('')}</table>`:'<span class="mut">None yet.</span>'}</div>`}
async function readFile(f){if(!f)return;try{const wb=XLSX.read(await f.arrayBuffer(),{cellDates:true}),js=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});if(!js.length)throw'File has no rows.';const ks=Object.keys(js[0]),fk=re=>ks.find(k=>re.test(k)),K={d:fk(/date/i),n:fk(/item|menu|product|name/i),q:fk(/qty|quant|sold|count/i),a:fk(/total|amount|sales/i),p:fk(/price|rate/i)};if(!K.n||!K.q)throw'Could not find Menu Item and Quantity columns. Found: '+ks.join(', ');P={K,f:f.name,raw:js};evalP()}catch(e){P=null;alert('Import problem: '+e)}draw()}

function prev(){const r=P.rows,un=[...new Set(r.filter(x=>!x.mid&&x.nm).map(x=>x.nm))],er=r.filter(x=>x.er.length),dp=r.filter(x=>x.dup),ok=!un.length&&!er.length;
 return`<p><b>${r.length}</b> rows · qty <b>${r.reduce((s,x)=>s+(x.q||0),0)}</b> · sales <b>${R(r.reduce((s,x)=>s+(x.a||0),0))}</b><br>Matched ${r.filter(x=>x.mid).length} · Unmatched ${un.length} · Duplicates ${dp.length} · Errors ${er.length}</p>`+
 un.map(n=>`<div class="row err card"><span>"${n}" is not in your menu</span><select onchange="mapN('${n.replace(/'/g,"\\'")}',this.value)"><option value="">Map to…</option>${S.menu.map(m=>`<option value="${m.id}">${m.name}</option>`).join('')}</select></div>`).join('')+er.map(x=>`<div class="card err">Row ${x.i}: ${x.er.join(', ')}</div>`).join('')+(dp.length?`<div class="card warn">${dp.length} rows already exist for that date and outlet. Confirming will replace them (no double counting).</div>`:'')+

function stock(){const prevD=addD(V.date,-1),o=V.out=='All'?OUT[0]:V.out,ex=id=>S.inv.find(e=>e.d==V.date&&e.o==o&&e.rm==id)||{},lock=!!S.closed[V.date+'|'+o],pv=id=>{const l=S.inv.filter(e=>e.d<V.date&&e.o==o&&e.rm==id&&e.close!=null).sort((a,b)=>a.d<b.d?1:-1)[0];return l?l.close:undefined};
 const f=(k,id,l,v)=>`<div><label>${l}</label><input id="${k}_${id}" type="number" step="any" inputmode="decimal" value="${v==null?'':v}" ${lock?'disabled':''}></div>`;
 return bar()+(V.out=='All'?'<p class="mut">Choose one outlet to enter stock. Entering for '+o+'.</p>':'')+`<div class="row"><button class="b s" onclick="V.date=addD(V.date,-1);draw()">◀ Previous day</button><button class="b s" onclick="V.date=addD(V.date,1);draw()">Next day ▶</button></div><div class="card"><h3>Daily stock · ${o} ${lock?'🔒 closed':''}</h3><p class="mut">Enter each material in its own unit. Leave blank if unchanged. Actual use is calculated for you.</p>${S.rm.filter(r=>!r.prep).map(r=>{const e=ex(r.id),p=pv(r.id);return`<div class="card"><b>${r.name}</b> <span class="mut">(${r.unit}) ${p!=null?'· last closing '+p:''}</span><div class="i3">${f('o',r.id,'Opening',e.open!=null?e.open:p)}${f('p',r.id,'Bought',e.pur)}${f('i',r.id,'Stock in',e.inn)}${f('t',r.id,'Out/transfer',e.out)}${f('c',r.id,'Closing',e.close)}${f('pp',r.id,'Price paid/'+r.unit,'')}</div></div>`}).join('')}${lock?`<p>This day is closed. Reopen it to change the numbers.</p><button class="b s" onclick="delete S.closed['${V.date}|${o}'];save();draw()">Reopen day</button>`:`<button class="b s" onclick="saveStock('${o}')">Save</button> <button class="b" onclick="saveStock('${o}',1)">Close day & start next day</button><p class="mut">Close day needs a closing count for every material. Tomorrow's Opening then fills in from today's closing.</p>`}</div>`+
 `<div class="card"><h3>Wastage · ${o}</h3><div class="row"><select id="wr">${S.rm.filter(r=>!r.prep).map(r=>`<option value="${r.id}">${r.name} (${r.unit})</option>`).join('')}</select><input id="wq" type="number" step="any" placeholder="Quantity"></div><div class="row"><select id="ww">${['Expired','Spoilage','Overproduction','Cooking error','Damaged','Spillage','Unknown','Other'].map(x=>`<option>${x}</option>`).join('')}</select><input id="wh" placeholder="Responsible person"></div><button class="b" onclick="saveWaste('${o}')">Add wastage</button>${S.waste.filter(w=>w.d==V.date&&w.o==o).map(w=>`<div class="mut">• ${rmOf(w.rm).name} ${w.qty} ${rmOf(w.rm).unit} · ${w.why} · ${R(w.qty*(price(w.rm,V.date)||0))}</div>`).join('')}<p class="mut">Wastage is already part of actual use (closing stock is counted after waste). It is shown separately to explain variance.</p></div>`}
function saveStock(o,cl){const err=[],add=[];S.rm.filter(r=>!r.prep).forEach(r=>{const v=k=>{const x=val(k+'_'+r.id);return x===''?null:parseFloat(x)},O=v('o'),P1=v('p'),I=v('i'),T=v('t'),C=v('c'),PP=v('pp');if([O,P1,I,T,C].every(x=>x==null)){if(cl)err.push(r.name+': closing missing');return}[O,P1,I,T,C,PP].forEach(x=>{if(x!=null&&x<0)err.push(r.name+': negative value')});if(C==null)err.push(r.name+': closing stock missing');if(O!=null&&C!=null&&O+(P1||0)+(I||0)-(T||0)-C<0)err.push(r.name+': closing is higher than opening + bought. Recheck the count.');add.push({d:V.date,o,rm:r.id,open:O||0,pur:P1||0,inn:I||0,out:T||0,close:C,pp:PP})});
 if(err.length||!add.length){alert(err.length?'Not saved:\n'+err.join('\n'):'Nothing entered.');return}
 S.inv=S.inv.filter(e=>!(e.d==V.date&&e.o==o)).concat(add.map(a=>{if(a.pp>0&&a.pp!=price(a.rm,V.date)){const r=rmOf(a.rm);r.prices=r.prices.filter(p=>p.d!=V.date);r.prices.push({d:V.date,p:a.pp,note:'Purchase'})}delete a.pp;return a}));if(cl){S.closed[V.date+'|'+o]=1;const nd=addD(V.date,1);V.date=nd;save();alert('Day closed. Opening for '+nd+' now starts from these closing counts.')}else{save();alert('Saved for '+V.date+'.')}draw()}
function saveWaste(o){const q=parseFloat(val('wq'));if(!(q>0)){alert('Enter a wastage quantity above 0.');return}S.waste.push({d:V.date,o,rm:val('wr'),qty:q,why:val('ww'),who:val('wh')});save();draw()}
function items(){const tg=S.set.target;
 return`<h2>Raw materials</h2><div class="card sc"><table><tr><th>Material</th><th>Now</th><th>Before</th><th>Change</th><th>Set price</th></tr>${S.rm.filter(r=>!r.prep).map(r=>{const c=price(r.id,V.date),p=prevPrice(r.id,V.date);return`<tr><td>${r.name}</td><td>${c==null?'<span class="a">missing</span>':'₹'+c+'/'+r.unit}</td><td>${p?'₹'+p.p:'–'}</td><td>${p&&c?N((c-p.p)/p.p*100,1)+'%':'–'}</td><td><input id="np_${r.id}" type="number" step="any" style="width:80px" onchange="setP('${r.id}',this.value)"></td></tr>`}).join('')}</table><p class="mut">A new price is saved with the date above (${V.date}) as history. Old costs are never rewritten. ₹/kg is converted to ₹/g automatically.</p></div>`+
 `<div class="card"><h3>Add raw material</h3><div class="row"><input id="an" placeholder="Name"><select id="au"><option value="kg">kg</option><option value="l">litre</option><option value="pc">piece</option><option value="g">gram</option><option value="pack">pack</option></select></div><div class="row"><input id="ap" type="number" placeholder="Price per unit ₹"><input id="am" type="number" placeholder="Min stock"></div><button class="b" onclick="addRM()">Add</button></div>`+
 `<h2>Sauces & prep items</h2>${prepHTML()}<h2>Menu & recipes</h2>${S.menu.map(m=>{const c=rcost(m,V.date),rc=recipe(m,V.date);return`<div class="card"><b>${m.name}</b> · ₹${m.price}<br>${c==null?'<span class="a">Missing recipe or ingredient price</span>':`Cost ${R2(c)} · Food cost ${N(c/m.price*100,1)}% (target ${tg}%) · Margin ${R2(m.price-c)}`}<br><span class="mut">${rc?rc.items.map(i=>`${rmOf(i.rm).name} ${i.q}${U[rmOf(i.rm).unit][0]} (${R2(i.q/fac(i.rm)*(price(i.rm,V.date)||0))})`).join(', ')+' · from '+rc.from:''}</span><br><button class="b s" onclick="editR('${m.id}')">Edit recipe</button></div>`}).join('')}`+(ED?edit():'')+
 `<div class="card"><h3>Add menu item</h3><div class="row"><input id="mn" placeholder="Name"><input id="mp" type="number" placeholder="Selling price ₹"></div><button class="b" onclick="addM()">Add</button></div>`}
function prepHTML(){return S.rm.filter(r=>r.prep).map(r=>{const rc=recipe(r,V.date),c=price(r.id,V.date),u=U[r.unit][0];return`<div class="card"><b>${r.name}</b><br>${c==null?'<span class="a">Add a recipe and batch size</span>':`Batch of ${rc.yield} ${u} costs <b>${R2(c*rc.yield/fac(r.id))}</b> · ${R2(c/fac(r.id)*100)} per 100 ${u}`}<br><span class="mut">${rc?rc.items.map(i=>`${rmOf(i.rm).name} ${i.q}${U[rmOf(i.rm).unit][0]} (${R2(i.q/fac(i.rm)*(price(i.rm,V.date)||0))})`).join(', '):''}</span><br><button class="b s" onclick="editR('${r.id}',1)">Edit recipe</button></div>`}).join('')+`<div class="card"><h3>Add sauce / prep item</h3><p class="mut">Something you make from raw materials, then use in menu items (mayo, garlic sauce, marinade).</p><div class="row"><input id="pn" placeholder="Name, e.g. Mayo sauce"><select id="pu"><option value="g">gram</option><option value="kg">kg</option><option value="l">litre</option><option value="pc">piece</option><option value="pack">pack</option></select></div><button class="b" onclick="addP()">Add</button></div>`}
function addP(){const n=val('pn').trim();if(!n){alert('Enter a name.');return}S.rm.push({id:'p'+Date.now(),name:n,unit:val('pu'),prep:1,prices:[],min:0,rec:[]});save();draw()}
function setP(id,v){v=parseFloat(v);if(!(v>0)){alert('Enter a price above 0.');return}const r=rmOf(id);r.prices=r.prices.filter(p=>p.d!=V.date);r.prices.push({d:V.date,p:v,note:'Manual'});save();draw()}
function addRM(){const n=val('an').trim(),p=parseFloat(val('ap'));if(!n||!(p>0)){alert('Enter a name and a price above 0.');return}S.rm.push({id:'r'+Date.now(),name:n,unit:val('au'),min:parseFloat(val('am'))||0,prices:[{d:'2000-01-01',p}]});save();draw()}
function addM(){const n=val('mn').trim(),p=parseFloat(val('mp'));if(!n||!(p>0)){alert('Enter a name and selling price.');return}S.menu.push({id:'m'+Date.now(),name:n,price:p,rec:[]});save();draw()}
function editR(id,pr){const m=pr?rmOf(id):S.menu.find(m=>m.id==id),rc=recipe(m,V.date);ED={id,prep:!!pr,yield:rc&&rc.yield,items:rc?rc.items.map(i=>({...i})):[]};draw();g('ed').scrollIntoView()}
function syncE(){if(ED.prep)ED.yield=parseFloat(val('ey'))||ED.yield;ED.items=ED.items.map((_,i)=>({rm:val('er'+i),q:parseFloat(val('eq'+i))||0}))}
function edit(){const m=ED.prep?rmOf(ED.id):S.menu.find(m=>m.id==ED.id);return`<div class="card" id="ed"><h3>Recipe: ${m.name}</h3>${ED.prep?`<div class="row"><span>This batch makes (g, ml, or number of pieces/packs)</span><input id="ey" type="number" value="${ED.yield||''}" placeholder="e.g. 1000"></div>`:''}${ED.items.map((it,i)=>`<div class="row"><select id="er${i}">${S.rm.filter(r=>!(ED.prep&&r.prep)&&r.id!=ED.id).map(r=>`<option value="${r.id}" ${r.id==it.rm?'selected':''}>${r.name}${r.prep?' (sauce)':''}</option>`).join('')}</select><input id="eq${i}" type="number" step="any" value="${it.q}" placeholder="g / ml / pc"><button class="b s" style="flex:0" onclick="syncE();ED.items.splice(${i},1);draw()">✕</button></div>`).join('')}<p class="mut">Quantities in g for kg materials, ml for litre materials, pieces for pieces (e.g. 180 = 180 g).</p><button class="b s" onclick="syncE();ED.items.push({rm:S.rm[0].id,q:0});draw()">+ Ingredient</button><div class="row" style="margin-top:8px"><span>Effective from</span><input id="ef" type="date" value="${V.date}"></div><button class="b" onclick="saveR()">Save as new version</button> <button class="b s" onclick="ED=null;draw()">Cancel</button><p class="mut">Earlier dates keep using the earlier recipe version.</p></div>`}
function saveR(){syncE();const m=ED.prep?rmOf(ED.id):S.menu.find(m=>m.id==ED.id),f=val('ef'),y=parseFloat(val('ey'));if(ED.prep&&!(y>0)){alert('Enter how much this batch makes.');return}if(!ED.items.length||ED.items.some(i=>!(i.q>0))){alert('Every ingredient needs a quantity above 0.');return}m.rec=m.rec.filter(r=>r.from!=f).concat({from:f,items:ED.items,yield:ED.prep?y:undefined});ED=null;save();draw()}
function sett(){const t=S.set.t;return`<h2>Settings</h2><div class="card"><div class="row"><label>Target food cost %</label><input id="st" type="number" value="${S.set.target}"></div><div class="row"><label>Watch / Attention / Critical at %</label><input id="s1" type="number" value="${t[0]}"><input id="s2" type="number" value="${t[1]}"><input id="s3" type="number" value="${t[2]}"></div><button class="b" onclick="S.set.target=+val('st');S.set.t=[+val('s1'),+val('s2'),+val('s3')];save();alert('Saved');draw()">Save</button></div><div class="card"><p>Clear demo data to start with real data. Raw materials and menu items marked demo are removed along with their stock, sales and wastage.</p><button class="b s" onclick="if(confirm('Remove all demo data?')){S.rm=S.rm.filter(x=>!x.demo);S.menu=S.menu.filter(x=>!x.demo);['inv','sales','waste'].forEach(k=>S[k]=S[k].filter(x=>!x.demo));save();draw()}">Clear demo data</button> <button class="b s" onclick="if(confirm('Reset everything to demo?')){localStorage.removeItem('nest2');location.reload()}">Reset to demo</button></div><p class="mut">Data is stored in this browser on this device only.</p>`}
