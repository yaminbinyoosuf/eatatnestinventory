name: Deploy to GitHub Pages

# Publishes the static app in ./public. No build step: the folder is uploaded
# verbatim as the Pages artifact.

on:
  push:
    branches: [main]
    # Deploy only when the app itself changes; pushes of backup scripts/docs do not redeploy.
    paths:
      - 'public/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
